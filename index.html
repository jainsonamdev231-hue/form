<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>JAJC NextGen Corp | Interview Form & Admin</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --accent: #10b981;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
      line-height: 1.5;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 1.6rem;
      color: #60a5fa;
    }

    header p {
      margin: 4px 0 14px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .nav-btns {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .nav-btn {
      flex: 1;
      max-width: 170px;
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .nav-btn.active {
      background: var(--primary);
      border-color: var(--primary);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .top-bar h2 {
      margin: 0;
      font-size: 1.2rem;
    }

    .btn-sm {
      background: #334155;
      color: #e2e8f0;
      border: 1px solid #475569;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 14px;
    }

    label {
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.92rem;
      color: #cbd5e1;
    }

    input, select, textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px;
      color: var(--text);
      font-size: 16px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #60a5fa;
    }

    textarea {
      resize: vertical;
      min-height: 85px;
    }

    .username-wrap {
      display: flex;
      align-items: center;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding-left: 12px;
    }

    .username-wrap span {
      color: var(--muted);
      font-weight: bold;
    }

    .username-wrap input {
      border: none;
    }

    .submit-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 15px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }

    .submit-btn:disabled {
      opacity: 0.6;
    }

    .hidden {
      display: none;
    }

    .applicant-card {
      background: #0f172a;
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 12px;
      padding: 15px;
      margin-top: 12px;
    }

    .applicant-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .badge {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .detail-row {
      margin: 5px 0;
      font-size: 0.9rem;
      color: #cbd5e1;
      word-break: break-word;
    }

    .detail-row strong {
      color: #94a3b8;
    }

    .status-msg {
      padding: 12px;
      border-radius: 10px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      margin-bottom: 14px;
      font-weight: 600;
      text-align: center;
    }

    .err-msg {
      padding: 14px;
      border-radius: 10px;
      background: rgba(248, 113, 113, 0.15);
      color: var(--danger);
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>JAJC NextGen Corp</h1>
      <p>Jain & Jha Corporation • Global Interview Portal</p>
      <div class="nav-btns">
        <button id="tabApply" class="nav-btn active" onclick="showTab('apply')">Apply Now</button>
        <button id="tabAdmin" class="nav-btn" onclick="showTab('admin')">🔒 Admin Check</button>
      </div>
    </header>

    <!-- INTERVIEW APPLICATION FORM -->
    <div id="applySection" class="card">
      <div class="top-bar">
        <h2>Interview Form</h2>
        <button type="button" class="btn-sm" onclick="fillDemoData()">✨ Fill Sample</button>
      </div>

      <div id="successBanner" class="status-msg hidden">
        ✅ Submitted! Open Admin Check to see it in the list.
      </div>

      <form id="interviewForm">
        <div class="form-group">
          <label for="fullName">Full Name *</label>
          <input type="text" id="fullName" placeholder="Enter your full name" required />
        </div>

        <div class="form-group">
          <label for="username">Username *</label>
          <div class="username-wrap">
            <span>@</span>
            <input type="text" id="username" placeholder="choose_a_username" required />
          </div>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number *</label>
          <input type="tel" id="phone" placeholder="e.g., +91 98765 43210" required />
        </div>

        <div class="form-group">
          <label for="email">Email Address *</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="position">Position You Want *</label>
          <select id="position" required>
            <option value="">-- Select a Position --</option>
            <option value="Web Developer">Web Developer (Web Making)</option>
            <option value="Game Developer">Game Developer (Game Making)</option>
            <option value="Advisor & Consultant">Advisor & Student Consultant</option>
            <option value="Helping & Support Lead">Helping & Support Lead</option>
            <option value="Finance & Loans Coordinator">Finance & Loans Coordinator</option>
          </select>
        </div>

        <div class="form-group">
          <label for="skills">Your Skills *</label>
          <input type="text" id="skills" placeholder="e.g., HTML, Scratch, Roblox, Math" required />
        </div>

        <div class="form-group">
          <label for="whyPosition">Why Do You Want This Position? *</label>
          <textarea id="whyPosition" placeholder="Tell us why you are a great fit..." required></textarea>
        </div>

        <div class="form-group">
          <label for="benefits">Benefits You Expect After Joining? *</label>
          <textarea id="benefits" placeholder="e.g., Learning coding, leadership, teamwork..." required></textarea>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">Submit Application</button>
      </form>
    </div>

    <!-- ADMIN LOGIN -->
    <div id="adminLoginSection" class="card hidden">
      <div class="top-bar">
        <h2>🔒 Admin Login</h2>
      </div>
      <form id="adminLoginForm">
        <div class="form-group">
          <label for="adminUser">Admin Username</label>
          <input type="text" id="adminUser" placeholder="jajc_admin" required />
        </div>
        <div class="form-group">
          <label for="adminPass">Admin Password</label>
          <input type="password" id="adminPass" placeholder="••••••••" required />
        </div>
        <button type="submit" class="submit-btn">Unlock Submissions</button>
      </form>
    </div>

    <!-- ADMIN VIEWER -->
    <div id="adminDashboard" class="card hidden">
      <div class="top-bar">
        <h2>Submissions (<span id="count">0</span>)</h2>
        <div style="display:flex; gap:8px;">
          <button class="btn-sm" onclick="loadSubmissions()">🔄 Refresh</button>
          <button class="btn-sm" onclick="logoutAdmin()">Log Out</button>
        </div>
      </div>

      <div class="form-group">
        <input
          type="text"
          id="searchBox"
          placeholder="🔍 Search name, @username, or position..."
          oninput="renderFiltered()"
        />
      </div>

      <div id="applicationsList">
        <p style="color:#94a3b8; text-align:center;">Checking submissions...</p>
      </div>
    </div>
  </div>

  <script>
    // ========================================================
    // PASTE YOUR FIREBASE DATABASE LINK BELOW (No slash at end)
    // Example: "https://jajc-corp-default-rtdb.firebaseio.com"
    // ========================================================
    const FIREBASE_URL = "PASTE_YOUR_FIREBASE_LINK_HERE";

    // ADMIN CREDENTIALS
    const ADMIN_USERNAME = "jajc_admin";
    const ADMIN_PASSWORD = "jajc2026";
    // ========================================================

    let isAdminLoggedIn = false;
    let allApps = [];

    function getCleanUrl() {
      const url = FIREBASE_URL.trim().replace(/\/$/, "");
      if (!url || url.includes("PASTE_YOUR")) {
        return null;
      }
      return url;
    }

    function showTab(tab) {
      const applySec = document.getElementById("applySection");
      const loginSec = document.getElementById("adminLoginSection");
      const dashSec = document.getElementById("adminDashboard");
      const tabApply = document.getElementById("tabApply");
      const tabAdmin = document.getElementById("tabAdmin");

      if (tab === "apply") {
        applySec.classList.remove("hidden");
        loginSec.classList.add("hidden");
        dashSec.classList.add("hidden");
        tabApply.classList.add("active");
        tabAdmin.classList.remove("active");
      } else {
        applySec.classList.add("hidden");
        tabApply.classList.remove("active");
        tabAdmin.classList.add("active");

        if (isAdminLoggedIn) {
          loginSec.classList.add("hidden");
          dashSec.classList.remove("hidden");
          loadSubmissions();
        } else {
          loginSec.classList.remove("hidden");
          dashSec.classList.add("hidden");
        }
      }
    }

    document.getElementById("adminLoginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const user = document.getElementById("adminUser").value.trim();
      const pass = document.getElementById("adminPass").value.trim();

      if (user === ADMIN_USERNAME && pass === ADMIN_PASSWORD) {
        isAdminLoggedIn = true;
        document.getElementById("adminLoginForm").reset();
        showTab("admin");
      } else {
        alert("❌ Wrong Admin Username or Password!");
      }
    });

    function logoutAdmin() {
      isAdminLoggedIn = false;
      showTab("apply");
    }

    function fillDemoData() {
      document.getElementById("fullName").value = "Aarav Patel";
      document.getElementById("username").value = "aarav_jajc";
      document.getElementById("phone").value = "+91 98765 43210";
      document.getElementById("email").value = "aarav.patel@example.com";
      document.getElementById("position").value = "Game Developer";
      document.getElementById("skills").value = "HTML, Game Design, Problem Solving";
      document.getElementById("whyPosition").value = "Excited to build games and websites with JAJC NextGen Corp.";
      document.getElementById("benefits").value = "Teamwork, coding practice, and growing the startup.";
    }

    document.getElementById("interviewForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const baseUrl = getCleanUrl();

      if (!baseUrl) {
        alert("⚠️ FIREBASE_URL is not set yet! Paste your Firebase database link inside the code first.");
        return;
      }

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.textContent = "Submitting...";

      const payload = {
        name: document.getElementById("fullName").value.trim(),
        username: document.getElementById("username").value.trim().replace(/^@/, ""),
        phone: document.getElementById("phone").value.trim(),
        email: document.getElementById("email").value.trim(),
        position: document.getElementById("position").value,
        skills: document.getElementById("skills").value.trim(),
        whyPosition: document.getElementById("whyPosition").value.trim(),
        benefits: document.getElementById("benefits").value.trim(),
        submittedAt: new Date().toLocaleString()
      };

      try {
        const res = await fetch(`${baseUrl}/applications.json`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          throw new Error("HTTP " + res.status);
        }

        document.getElementById("interviewForm").reset();
        const banner = document.getElementById("successBanner");
        banner.classList.remove("hidden");
        setTimeout(() => banner.classList.add("hidden"), 5000);
      } catch (err) {
        alert("❌ Could not submit. Check your FIREBASE_URL and ensure Firebase Realtime Database is in Test Mode.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Submit Application";
      }
    });

    async function loadSubmissions() {
      const list = document.getElementById("applicationsList");
      const baseUrl = getCleanUrl();

      if (!baseUrl) {
        list.innerHTML = `<div class="err-msg">⚠️ FIREBASE_URL is missing! Paste your Firebase link in the code so submissions can sync globally.</div>`;
        document.getElementById("count").textContent = "0";
        return;
      }

      list.innerHTML = `<p style="color:#94a3b8; text-align:center;">⏳ Loading submissions from Firebase...</p>`;

      try {
        const res = await fetch(`${baseUrl}/applications.json`);
        if (!res.ok) {
          throw new Error("HTTP " + res.status);
        }

        const data = await res.json();
        allApps = data ? Object.values(data).reverse() : [];
        renderFiltered();
      } catch (err) {
        list.innerHTML = `<div class="err-msg">❌ Failed to read submissions. Check the FIREBASE_URL link and Firebase Test Mode rules.</div>`;
      }
    }

    function renderFiltered() {
      const query = document.getElementById("searchBox").value.toLowerCase().trim();
      const list = document.getElementById("applicationsList");
      document.getElementById("count").textContent = allApps.length;

      const filtered = allApps.filter(
        (app) =>
          String(app.name || "").toLowerCase().includes(query) ||
          String(app.username || "").toLowerCase().includes(query) ||
          String(app.position || "").toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        list.innerHTML = `<p style="color:#94a3b8; text-align:center;">No submissions found yet.</p>`;
        return;
      }

      list.innerHTML = filtered
        .map(
          (app) => `
          <div class="applicant-card">
            <div class="applicant-header">
              <div>
                <strong>${app.name}</strong> <span style="color:#60a5fa;">(@${app.username})</span>
              </div>
              <span class="badge">${app.position}</span>
            </div>
            <div class="detail-row"><strong>Phone:</strong> ${app.phone} | <strong>Email:</strong> ${app.email}</div>
            <div class="detail-row"><strong>Skills:</strong> ${app.skills}</div>
            <div class="detail-row"><strong>Why:</strong> ${app.whyPosition}</div>
            <div class="detail-row"><strong>Benefits:</strong> ${app.benefits}</div>
            <div class="detail-row" style="font-size:0.8rem; color:#64748b;"><strong>Time:</strong> ${app.submittedAt || "N/A"}</div>
          </div>
        `
        )
        .join("");
    }
  </script>
</body>
</html>
