<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JAJC NextGen Corp | Careers & Admin Portal</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --accent: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 880px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      padding: 24px 28px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid var(--border);
      border-radius: 16px;
      margin-bottom: 24px;
    }

    header h1 {
      margin: 0;
      font-size: 1.8rem;
      color: #60a5fa;
    }

    header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .nav-btns {
      display: flex;
      gap: 10px;
    }

    .nav-btn {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }

    .nav-btn.active {
      background: var(--primary);
      border-color: var(--primary);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 14px;
    }

    .top-bar h2 {
      margin: 0;
      font-size: 1.3rem;
    }

    .demo-btn {
      background: #334155;
      color: #e2e8f0;
      border: 1px solid #475569;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .demo-btn:hover {
      background: #475569;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 650px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 16px;
    }

    label {
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.95rem;
      color: #cbd5e1;
    }

    input, select, textarea {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #60a5fa;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .username-wrap {
      display: flex;
      align-items: center;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding-left: 12px;
    }

    .username-wrap span {
      color: var(--muted);
      font-weight: bold;
    }

    .username-wrap input {
      border: none;
      width: 100%;
    }

    .submit-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    .submit-btn:hover {
      background: var(--primary-dark);
    }

    .hidden {
      display: none;
    }

    .admin-controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .admin-controls input {
      flex: 1;
      min-width: 220px;
    }

    .danger-btn {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid #ef4444;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }

    .applicant-card {
      background: #0f172a;
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 12px;
      padding: 18px;
      margin-top: 14px;
    }

    .applicant-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .badge {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .detail-row {
      margin: 6px 0;
      font-size: 0.93rem;
      color: #cbd5e1;
    }

    .detail-row strong {
      color: #94a3b8;
    }

    .status-msg {
      padding: 12px;
      border-radius: 10px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      margin-bottom: 16px;
      font-weight: 600;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>JAJC NextGen Corp</h1>
        <p>Jain & Jha Corporation • Official Interview Portal</p>
      </div>
      <div class="nav-btns">
        <button id="tabApply" class="nav-btn active" onclick="showTab('apply')">Apply Now</button>
        <button id="tabAdmin" class="nav-btn" onclick="showTab('admin')">🔒 Admin Panel</button>
      </div>
    </header>

    <!-- PUBLIC APPLICATION FORM -->
    <div id="applySection" class="card">
      <div class="top-bar">
        <h2>Interview Application Form</h2>
        <button type="button" class="demo-btn" onclick="fillDemoData()">
          ✨ Fill Sample Applicant
        </button>
      </div>

      <div id="successBanner" class="status-msg hidden">
        ✅ Your application has been sent to JAJC NextGen Corp Admins!
      </div>

      <form id="interviewForm">
        <div class="grid">
          <div class="form-group">
            <label for="fullName">Full Name *</label>
            <input type="text" id="fullName" placeholder="Enter your full name" required />
          </div>

          <div class="form-group">
            <label for="username">Username *</label>
            <div class="username-wrap">
              <span>@</span>
              <input type="text" id="username" placeholder="choose_a_username" required />
            </div>
          </div>

          <div class="form-group">
            <label for="phone">Phone Number *</label>
            <input type="tel" id="phone" placeholder="e.g., +91 98765 43210" required />
          </div>

          <div class="form-group">
            <label for="email">Email Address *</label>
            <input type="email" id="email" placeholder="you@example.com" required />
          </div>
        </div>

        <div class="grid">
          <div class="form-group">
            <label for="position">Position You Want *</label>
            <select id="position" required>
              <option value="">-- Select a Position --</option>
              <option value="Web Developer">Web Developer (Web Making)</option>
              <option value="Game Developer">Game Developer (Game Making)</option>
              <option value="Advisor & Consultant">Advisor & Student Consultant</option>
              <option value="Helping & Support Lead">Helping & Support Lead</option>
              <option value="Finance & Loans Coordinator">Finance & Loans Coordinator</option>
            </select>
          </div>

          <div class="form-group">
            <label for="skills">Your Skills *</label>
            <input type="text" id="skills" placeholder="e.g., HTML, Scratch, Roblox, Math, Teamwork" required />
          </div>
        </div>

        <div class="form-group">
          <label for="whyPosition">Why Do You Want This Position? *</label>
          <textarea id="whyPosition" placeholder="Tell us why you are a great fit..." required></textarea>
        </div>

        <div class="form-group">
          <label for="benefits">What Benefits Do You Expect After Joining? *</label>
          <textarea id="benefits" placeholder="e.g., Learning coding, leadership role, teamwork..." required></textarea>
        </div>

        <button type="submit" class="submit-btn">Submit Interview Application</button>
      </form>
    </div>

    <!-- ADMIN LOGIN BOX -->
    <div id="adminLoginSection" class="card hidden">
      <div class="top-bar">
        <h2>🔒 Admin Login — JAJC NextGen Corp</h2>
      </div>
      <form id="adminLoginForm">
        <div class="grid">
          <div class="form-group">
            <label for="adminUser">Admin Username</label>
            <input type="text" id="adminUser" placeholder="Enter admin username" required />
          </div>
          <div class="form-group">
            <label for="adminPass">Admin Password</label>
            <input type="password" id="adminPass" placeholder="Enter admin password" required />
          </div>
        </div>
        <button type="submit" class="submit-btn">Unlock Admin Dashboard</button>
      </form>
    </div>

    <!-- ADMIN DASHBOARD (ONLY VISIBLE AFTER LOGIN) -->
    <div id="adminDashboard" class="card hidden">
      <div class="top-bar">
        <h2>Admin Dashboard • Total Applicants: <span id="count">0</span></h2>
        <button class="demo-btn" onclick="logoutAdmin()">Log Out</button>
      </div>

      <div class="admin-controls">
        <input
          type="text"
          id="searchBox"
          placeholder="🔍 Search by name, @username, or position to check who applied..."
          oninput="renderApplications()"
        />
        <button class="danger-btn" onclick="clearAllApplications()">Clear All</button>
      </div>

      <div id="applicationsList"></div>
    </div>
  </div>

  <script>
    // ==========================================
    // ADMIN CREDENTIALS (You can edit these!)
    // ==========================================
    const ADMIN_USERNAME = "jajc_admin";
    const ADMIN_PASSWORD = "jajc2026";
    // ==========================================

    let isAdminLoggedIn = false;

    // Default sample applicant if storage is empty
    const defaultData = [
      {
        name: "Aarav Sharma",
        username: "aarav_dev",
        phone: "+91 98765 43210",
        email: "aarav.sharma@schoolmail.com",
        position: "Game Developer",
        skills: "Scratch, Python Basics, Game Design",
        whyPosition: "I love building mini-games and want to help JAJC NextGen Corp create games for students.",
        benefits: "Working with a creative team and improving my coding skills.",
        submittedAt: "Sample Entry"
      }
    ];

    function getApplications() {
      const saved = localStorage.getItem("jajc_applications");
      if (!saved) {
        localStorage.setItem("jajc_applications", JSON.stringify(defaultData));
        return defaultData;
      }
      return JSON.parse(saved);
    }

    function saveApplications(apps) {
      localStorage.setItem("jajc_applications", JSON.stringify(apps));
    }

    function showTab(tab) {
      const applySec = document.getElementById("applySection");
      const loginSec = document.getElementById("adminLoginSection");
      const dashSec = document.getElementById("adminDashboard");
      const tabApply = document.getElementById("tabApply");
      const tabAdmin = document.getElementById("tabAdmin");

      if (tab === "apply") {
        applySec.classList.remove("hidden");
        loginSec.classList.add("hidden");
        dashSec.classList.add("hidden");
        tabApply.classList.add("active");
        tabAdmin.classList.remove("active");
      } else {
        applySec.classList.add("hidden");
        tabApply.classList.remove("active");
        tabAdmin.classList.add("active");

        if (isAdminLoggedIn) {
          loginSec.classList.add("hidden");
          dashSec.classList.remove("hidden");
          renderApplications();
        } else {
          loginSec.classList.remove("hidden");
          dashSec.classList.add("hidden");
        }
      }
    }

    // Handle Admin Login
    document.getElementById("adminLoginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const user = document.getElementById("adminUser").value.trim();
      const pass = document.getElementById("adminPass").value.trim();

      if (user === ADMIN_USERNAME && pass === ADMIN_PASSWORD) {
        isAdminLoggedIn = true;
        document.getElementById("adminLoginForm").reset();
        showTab("admin");
      } else {
        alert("❌ Wrong Admin Username or Password!");
      }
    });

    function logoutAdmin() {
      isAdminLoggedIn = false;
      showTab("apply");
    }

    // Fill Sample Applicant
    function fillDemoData() {
      document.getElementById("fullName").value = "Riya Verma";
      document.getElementById("username").value = "riya_web";
      document.getElementById("phone").value = "+91 91234 56789";
      document.getElementById("email").value = "riya.verma@schoolmail.com";
      document.getElementById("position").value = "Web Developer";
      document.getElementById("skills").value = "HTML, CSS, Canva Design, Communication";
      document.getElementById("whyPosition").value = "I enjoy designing clean websites and want to build pages for JAJC NextGen Corp.";
      document.getElementById("benefits").value = "Hands-on web project experience and teamwork skills.";
    }

    // Handle New Application Submission
    document.getElementById("interviewForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const newApp = {
        name: document.getElementById("fullName").value.trim(),
        username: document.getElementById("username").value.trim().replace(/^@/, ""),
        phone: document.getElementById("phone").value.trim(),
        email: document.getElementById("email").value.trim(),
        position: document.getElementById("position").value,
        skills: document.getElementById("skills").value.trim(),
        whyPosition: document.getElementById("whyPosition").value.trim(),
        benefits: document.getElementById("benefits").value.trim(),
        submittedAt: new Date().toLocaleString()
      };

      const apps = getApplications();
      apps.unshift(newApp);
      saveApplications(apps);

      document.getElementById("interviewForm").reset();
      const banner = document.getElementById("successBanner");
      banner.classList.remove("hidden");
      setTimeout(() => banner.classList.add("hidden"), 4000);
    });

    // Render Applications inside Admin Dashboard
    function renderApplications() {
      const apps = getApplications();
      const query = document.getElementById("searchBox").value.toLowerCase().trim();
      const list = document.getElementById("applicationsList");
      document.getElementById("count").textContent = apps.length;

      const filtered = apps.filter(
        (app) =>
          app.name.toLowerCase().includes(query) ||
          app.username.toLowerCase().includes(query) ||
          app.position.toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        list.innerHTML = `<p style="color:#94a3b8; text-align:center;">No matching applications found.</p>`;
        return;
      }

      list.innerHTML = filtered
        .map(
          (app) => `
          <div class="applicant-card">
            <div class="applicant-header">
              <div>
                <strong>${app.name}</strong> <span style="color:#60a5fa;">(@${app.username})</span>
              </div>
              <span class="badge">${app.position}</span>
            </div>
            <div class="detail-row"><strong>Phone:</strong> ${app.phone} | <strong>Email:</strong> ${app.email}</div>
            <div class="detail-row"><strong>Skills:</strong> ${app.skills}</div>
            <div class="detail-row"><strong>Why this position:</strong> ${app.whyPosition}</div>
            <div class="detail-row"><strong>Expected benefits:</strong> ${app.benefits}</div>
            <div class="detail-row" style="font-size:0.8rem; color:#64748b;"><strong>Applied on:</strong> ${app.submittedAt}</div>
          </div>
        `
        )
        .join("");
    }

    function clearAllApplications() {
      if (confirm("Are you sure you want to delete all saved applications?")) {
        saveApplications([]);
        renderApplications();
      }
    }
  </script>
</body>
</html>
