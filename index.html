<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>JAJC NextGen Corp | Interview Application</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
      line-height: 1.5;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 1.65rem;
      color: #60a5fa;
    }

    header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 14px;
    }

    label {
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.92rem;
      color: #cbd5e1;
    }

    input, select, textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px;
      color: var(--text);
      font-size: 16px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #60a5fa;
    }

    textarea {
      resize: vertical;
      min-height: 85px;
    }

    .submit-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 15px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>JAJC NextGen Corp</h1>
      <p>Jain & Jha Corporation • Official Interview Portal</p>
    </header>

    <div class="card">
      <form action="https://formsubmit.co/devanshjain0823@gmail.com" method="POST">
        
        <input type="hidden" name="_subject" value="New JAJC NextGen Corp Application!" />
        <input type="hidden" name="_template" value="table" />

        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" name="Full Name" placeholder="Enter your full name" required />
        </div>

        <div class="form-group">
          <label>Username *</label>
          <input type="text" name="Username" placeholder="@username" required />
        </div>

        <div class="form-group">
          <label>Phone Number *</label>
          <input type="tel" name="Phone Number" placeholder="e.g., +91 98765 43210" required />
        </div>

        <div class="form-group">
          <label>Email Address *</label>
          <input type="email" name="Email" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label>Position You Want *</label>
          <select name="Position" required>
            <option value="">-- Select a Position --</option>
            <option value="Web Developer">Web Developer (Web Making)</option>
            <option value="Game Developer">Game Developer (Game Making)</option>
            <option value="Advisor & Consultant">Advisor & Student Consultant</option>
            <option value="Helping & Support Lead">Helping & Support Lead</option>
            <option value="Finance & Loans Coordinator">Finance & Loans Coordinator</option>
          </select>
        </div>

        <div class="form-group">
          <label>Your Skills *</label>
          <input type="text" name="Skills" placeholder="e.g., HTML, Scratch, Roblox, Math" required />
        </div>

        <div class="form-group">
          <label>Why Do You Want This Position? *</label>
          <textarea name="Why This Position" placeholder="Tell us why you are a great fit..." required></textarea>
        </div>

        <div class="form-group">
          <label>Benefits You Expect After Joining? *</label>
          <textarea name="Expected Benefits" placeholder="e.g., Learning coding, leadership, teamwork..." required></textarea>
        </div>

        <button type="submit" class="submit-btn">Submit Application</button>
      </form>
    </div>
  </div>

</body>
</html>
